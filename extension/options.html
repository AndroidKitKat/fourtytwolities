<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FourtyTwolities</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: Canvas;
        --fg: CanvasText;
        --muted: color-mix(in srgb, CanvasText 65%, Canvas);
        --line: color-mix(in srgb, CanvasText 18%, Canvas);
        --accent: #111;
      }
      @media (prefers-color-scheme: dark) {
        --accent: #f5f5f7;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      h1 {
        font-size: 1.35rem;
        letter-spacing: -0.03em;
        margin: 0 0 0.4rem;
      }
      p,
      label {
        color: var(--muted);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 1.4rem 0 0.4rem;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 0.7rem 0.8rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.7rem;
      }
      button {
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        border-radius: 999px;
        padding: 0.45rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: Canvas;
        border-color: transparent;
      }
      #status {
        min-height: 1.4em;
        margin-top: 1rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FourtyTwolities</h1>
      <p>
        Unofficial helper for grok.com. Not affiliated with xAI. Auto-confirms
        the “Send this message?” dialog only when the URL hash includes
        <code>#gwc=</code> plus this token.
      </p>
      <p>
        Example:
        <code>https://grok.com/?q=hello#gwc=TOKEN</code>
        or with private chat
        <code>#private&amp;gwc=TOKEN</code>
      </p>

      <label for="token">Token</label>
      <input id="token" type="text" spellcheck="false" autocomplete="off" />
      <div class="row">
        <button id="copy-token" type="button">Copy token</button>
        <button id="generate" type="button">Regenerate</button>
        <button id="save" class="primary" type="button">Save</button>
      </div>

      <label for="sample">Sample URL</label>
      <input id="sample" type="text" readonly />
      <div class="row">
        <button id="copy-sample" type="button">Copy sample URL</button>
      </div>

      <p id="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
